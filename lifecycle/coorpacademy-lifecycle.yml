deprecation:
  policy_documented: false
  deprecated_operations: []
  sunset_header: false
  notes: >-
    No deprecation or sunset policy on any Coorpacademy page. Zero of the 155 operations across the
    fourteen specs carry `deprecated: true`, and zero specs mention Deprecation or Sunset headers. No
    `Deprecation` pointer is emitted — this is a real absence, not a missing pointer.
  material_risk: >-
    The relevant deprecation question for this provider is not per-operation, it is whole-product.
    Coorpacademy was acquired by Go1 in April 2022 and the site now brands itself "Coorpacademy by
    Go1"; https://www.coorpacademy.com/en/ and /en/blog/ both 302 to https://www.go1.com/?source=coorp,
    the top-nav "Bibliothèque Go1" and CONTACT links point at go1.com, and the SCORM content API
    carries POST /getProgressionFromEnrolment "Get Progressions from go1 enrolment_id" while the mail
    API carries POST /api/v1/go1Subscription. The English-language front door has already been handed
    over to Go1. Anyone integrating against api.coorpacademy.com should ask Go1 directly how long
    these fourteen services will be served, because no published policy answers it.
  probed:
