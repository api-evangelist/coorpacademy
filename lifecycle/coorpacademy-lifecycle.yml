    progression services in openapi/. The other twelve services (content, scim, scorm, content-scorm,
    mail, mobile, review, h5p, external, media, pdf, progression-aggregations) have NO component on
    the status page, so an integrator watching status.io cannot see the health of the services it
    actually calls.
