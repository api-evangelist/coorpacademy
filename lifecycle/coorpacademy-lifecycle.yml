  note: >-
    A genuine machine-readable status surface — a status.io page with a public JSON status API, an RSS
    feed and an iCal feed, and it names the underlying infrastructure per component. This is the
    strongest operational artifact Coorpacademy publishes. But note the component list is the
    2017-era architecture (Docker Cloud shut down in 2018; "Bricklane" and "Cockpit" are internal
    codenames) and every component's own `updated` timestamp is 2023-03-16, so the page itself has
    not been reorganised in three years even though the overall status object refreshes live.
  named_components_do_not_match_apis: >-
