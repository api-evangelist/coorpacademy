method: searched
source: >-
  registry.npmjs.org — scope search (https://registry.npmjs.org/-/v1/search?text=coorpacademy) plus
  per-package metadata endpoints for every entry below; cross-checked against
  https://github.com/CoorpAcademy. PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist and
  crates.io were also searched and returned nothing first-party.
summary: >-
  Coorpacademy maintains a large, genuinely active first-party open-source estate on npm — 73 packages
  surfaced by a registry search, with releases as recent as 2026-07-07 — but NOT ONE OF THEM IS AN API
  CLIENT LIBRARY. There is no @coorpacademy/api, no SDK for the content, progression, platform or SCIM
  services, and no generated client in any language. The estate is front-end (a React design system,
  the slide-player, the review app), infrastructure tooling (Serverless framework plugins), and
  maintained forks. A developer integrating the fourteen documented REST services writes their own
  HTTP client.
sdk_finding:
  first_party_api_client_libraries: 0
  languages_covered: []
  pointer_emitted: false
  pointer_rationale: >-
    NO `SDKs` pointer is emitted in apis.yml. The `sdk_count` check asks whether a provider ships
    client libraries for its API; Coorpacademy ships 73 npm packages and zero API clients. Emitting
    `SDKs` off a design-system library would credit an integration surface that does not exist. The
    `Packages` pointer IS emitted, because the open-source estate is real and worth recording.
