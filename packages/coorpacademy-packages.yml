  stale_clusters:
  - 'baucis forks (2025-05-20) — the API-spec generators; still the newest thing touching the specs'
  - 'swagger-ui-express fork (2021-06-15) — five years'
  - 'squirrel / kinesis / etcd3 (2019-2020) — abandoned'
  - 'coorpacademy-core (2016) — abandoned'
  abandonment_signal: >-
    The decay pattern here is unusually informative. The front end and the infrastructure tooling are
    shipping monthly in 2026. The API-specification generators (baucis-openapi3, baucis-swagger2) last
    moved 2025-05-20, and the Swagger UI that serves the whole public developer surface last moved
    2021-06-15. The parts of the toolchain that produce and present the public API contracts are the
    parts that stopped being maintained.
