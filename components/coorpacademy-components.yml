      coorpacademy.github.io/components/app-review. Probed 2026-08-17: coorpacademy.github.io/ and
      /components both return 404 — the GitHub Pages demo the packages advertise is dead. The README
      also references Excalidraw architecture diagrams by relative path into the monorepo, not a
      published URL.
