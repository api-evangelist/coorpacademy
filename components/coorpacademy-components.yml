licensing_caveat: >-
  Most @coorpacademy front-end packages publish NO license field on npm at all (components,
  player-web, player-store, player-services, progression-engine, nova-icons, translate, history,
  redux-history, redux-task), and app-review publishes `UNLICENSED`. Absent a license, default
  copyright applies: these are public but not open source. The MIT-licensed packages in the estate are
  the infrastructure tooling and the maintained forks, not the product code. See
  packages/coorpacademy-packages.yml.
