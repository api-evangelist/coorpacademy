summary: >-
  Coorpacademy publishes its front-end estate as a public npm monorepo — a React design system, an
  icon library, the slide-player and the review app — under the @coorpacademy scope. These are
  CLIENT-SIDE UI components, real and actively released (most recent 2026-06-05), and they are the only
  first-party consumable libraries the company ships. They are NOT SDKs and they are NOT documented as
  an embed/integration surface for third parties: there is no "add Coorpacademy to your app" guide, no
  hosted loader script, no CDN embed snippet and no documented public props contract. Recorded here
  because they exist and are consumable, with that caveat stated plainly.
distribution:
