generated: '2026-08-17'
method: derived
source: >-
  Derived from $ref graphs and id-reference fields across openapi/coorpacademy-content-openapi.json
  (63 schemas), openapi/coorpacademy-progression-openapi.json (23), openapi/coorpacademy-platform-openapi.json
  (16), openapi/coorpacademy-content-scorm-openapi.json (23), openapi/coorpacademy-progression-aggregations-openapi.json
  (7) and openapi/coorpacademy-scim-openapi.json (1). No object reference or ERD is published by the
  provider; no id-prefix scheme exists.
summary: >-
  Coorpacademy's model has an unusual spine: nothing is joined by a global object id. Every content
  entity is addressed by the composite key (repository, ref, version) — `repository` is the tenant
  scope, `ref` is a human-authored string key, `version` is an integer generation — and the learner
  side is joined by (userId, content.ref, content.version). Only two schemas in the whole estate expose
  a database id (`Progression._id`, `slide._id`), and there is no id-prefix convention, no URN, no UUID
  and no cross-service foreign key. An agent cannot follow a link between two Coorpacademy resources;
  it must reconstruct the composite key itself.
identifier_scheme:
  style: composite-natural-key
  content_key: [repository, ref, version]
  learner_key: [userId, content.ref, content.version]
  id_prefixes: none
  urns: false
  uuids: false
  exposed_database_ids:
  - schema: Progression
    field: _id
    service: progression
  - schema: slide
    field: _id
    service: content-scorm
  - schema: slide
    field: chapter_id
    service: content-scorm
  note: >-
    `ref` values are opaque author-chosen strings, not derivable. `version` is an integer publication
    generation, and 409 Conflict on write means (repository, ref, version) already exists — see
    errors/coorpacademy-problem-types.yml.
tenancy:
  root_entity: Brand
  scoping_fields: [repository, brand, brandName]
  note: >-
    `Brand` (platform API) and `repository` (content API) are two names for the tenant boundary at
    different layers — a brand has a host/alias and a content repository. SCIM scopes on `{brand}`.
    Every read and write in the estate is tenant-scoped and there is no cross-tenant surface.
entities:
- name: Brand
  service: platform
  schema: Brand
  key: [alias, host]
  description: >-
    The tenant. Carries alias, host and a BrandPayload (name, description, skin, moocName, teamName,
    teamEmail, assistanceEmail, contentCategoryName, sector, baseUrl, defaultTimePerChapter, language)
    plus the SSO configuration and a user-import payload.
- name: SSOPayload
  service: platform
  schema: SSOPayload
  description: >-
    Per-brand SSO configuration — `enabled`, `connectEnabled`, `enableDefaultRoute`, `type`, and one of
    `saml2` (SAMLPayload) or `oidc` (OIDCPayload). Both carry a userMappingPayload mapping IdP claims
    onto uniqueLogin, emails, name, provider, language, providerInfos, roles and organizations.
- name: ExternalCourse
  service: content
  key: [repository, ref]
  description: A course sourced from outside the Coorpacademy catalogue.
- name: ExternalContent
  service: content
  key: [repository, ref]
  description: A content item belonging to an ExternalCourse.
- name: BulkExternalContent
  service: content
  key: [repository, ref]
  description: >-
    A bulk-ingest job for external content. Carries a BulkExternalContentMeta and an array of
    ExternalContentForBulk, each of which can carry ErrorResource {type, fileName} and
    ErrorCSV {column, errorCode, description} rows — the per-row ingest failure record.
- name: Skill
  service: content
  schema: SkillStructure / SkillResponse
  key: [repository, ref]
  description: A catalogue skill with locale-specific labels (SkillLocales) and a Meta block.
- name: CustomSkill
  service: content
  schema: CustomSkillEdition / CustomSkillConsommation
  key: [repository, ref]
  description: >-
    A tenant-authored skill. Exists in two parallel shapes — an EDITION (draft, editable) and a
    CONSOMMATION (published, consumed by learners) — with an /undo operation to revert the edition to
    the last published snapshot.
- name: Certification
  service: content
  schema: CertificationSnapshot / CertificationEdition / CertificationDiff / CertificationConsommation
  key: [repository, ref, version]
  description: >-
    The richest entity in the model, and the clearest example of the edition/snapshot/diff pattern:
    CertificationEdition (draft) → CertificationDiff (pending change) → CertificationSnapshot
    (published) → CertificationConsommation (learner-facing). Its structure carries
    CertificationCondition (with CertificationConditionItemsDecoder referencing content refs) and
    CertificationRewards, which fans out to DiplomaRewards, ResourceRewards and StarsRewards.
- name: CustomPlaylist
  service: content
  schema: CustomPlaylistEdition / CustomPlaylistConsommation
  key: [repository, ref]
  description: >-
    A tenant-curated playlist. Its structure is a CustomPlaylistItemMap of content refs; same
    edition/consommation split and same /undo semantics as CustomSkill.
- name: Script
  service: content
  schema: ScriptResponse / ScriptStructure
  key: [repository, videoId, lang]
  description: >-
    Video transcript/subtitle script, keyed on videoId and language. ScriptLocales carries a
    `jwTrackId`, a JW Player track identifier — an external-system reference with no documented
    resolver.
- name: Notification
  service: content
  key: [name]
  description: >-
    A platform notification typed `feature`, `maintenance` or `survey`. The only content entity keyed
    on a bare `name` rather than (repository, ref).
- name: Progression
  service: progression
  schema: Progression / UpdatedProgression
  key: [_id]
  description: >-
    The central learner entity. Joins userId to a Content {ref, type, version} through an Engine
    {ref, version} with EngineOptions {livesDisabled, shuffleChoices, lives}, a Meta {createdAt,
    updatedAt, source} and a State.
- name: State
  service: progression
  description: >-
    The progression state machine's memory — content, nextContent, isCorrect, lives, livesDisabled,
    slides, pendingSlides, step, stars, requestedClues, hasViewedAResourceAtThisStep, viewedResources,
    variables, remainingLifeRequests. This is the same vocabulary the public
    @coorpacademy/progression-engine npm package implements client-side.
- name: Action
  service: progression
  description: >-
    An append-only event on a progression, typed and carrying a payload. In content-scorm the payload
    variants are enumerated: answerActionPayload, moveActionPayload, askCluePayload, extralifePayload,
    contentResourceViewedPayload.
- name: AnalyticsProgression
  service: progression, progression-aggregations
  key: [userId, content.ref, content.version]
  description: >-
    The read-model projection — engine, userId, content, current, lastProgressionId, success, stars,
    lives, remainingLifeRequests, createdAt, firstCompletionDate, lastCompletionDate, updatedAt.
    Backed by DynamoDB (the query cursor is exposed as from[partitionKey]/from[sortKey]/from[updatedAt]).
- name: CurrentProgression
  service: progression
  key: [userId, content.ref]
  description: Which progression a learner has in flight — carries currentProgressionId and inProgress.
- name: ReviewCompletions
  service: progression
  key: [userId, content]
  description: Review-mode completion state — stars, progressionId, isDone, nbSlide, updatedAt.
- name: HeroRecommendation
  service: progression
  description: The next recommended content for a learner, with nbSlides and progressionId.
- name: Slide
  service: content-scorm
  key: [_id]
  description: >-
    The atomic learning unit — question, clue, klf ("ce qu'il faut retenir"), lessons, tips, authors,
    eligibleForReview, chapter_id. This is the only entity in the estate with a parent-id foreign key
    (chapter_id).
- name: ScormProgress
  service: content-scorm
  description: >-
    SCORM-runtime projection — completionStatus, completionSuccess, score. This is where the internal
    progression model is translated into SCORM's vocabulary for a host LMS.
- name: SCIM User
  service: scim
  schema: IDPUserBodyRequest
  key: [brand, userId]
  description: The provisioned user record, created and maintained by the customer's identity provider.
