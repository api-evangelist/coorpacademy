patterns:
- name: edition / snapshot / consommation / diff
  applies_to: [Certification, CustomSkill, CustomPlaylist]
  description: >-
    Authoring-heavy content entities exist in up to four parallel shapes: an EDITION (mutable draft), a
    DIFF (pending change set), a SNAPSHOT (published immutable generation, keyed by version), and a
    CONSOMMATION (the learner-facing projection, served from a separate /consommation/ path prefix with
    its own upsert and count operations). Every one of the three exposes PUT .../{ref}/undo to revert
    the edition to the last published snapshot.
  agent_note: >-
    This is the single most important thing to understand before writing to the content API. Writing to
    the edition does NOT change what learners see; the snapshot upsert does. An agent that upserts an
    edition and reports success has not published anything.
- name: soft delete via state enum
  applies_to: [Skill, Certification, CustomPlaylist, CustomSkill, ExternalCourse, Script, Notification]
  description: >-
    State enum `published` / `draft` / `archived` / `deleted` with an `includeDeleted` query flag,
    rather than hard deletion.
- name: composite natural key
  applies_to: all content entities
  description: (repository, ref, version) — no surrogate ids, no URNs.
gaps:
- >-
  There is no Users, Learners, Groups, Organizations or Roles resource anywhere in the fourteen
  services. `userId` appears as a path and body field across progression, review and analytics, and
  nothing resolves it. SCIM can create a user and cannot list that user's progressions.
- >-
  There is no Course, Chapter, Level or Content resource in the CONTENT API. The content service
  manages EXTERNAL courses, skills, certifications, playlists and scripts; the actual Coorpacademy
  course/chapter/level/slide graph is only readable through the SCORM player API
  (content-scorm: GET /chapter/{ref}, /level/{ref}, /slide/{ref}), which is a player runtime rather
  than a catalogue API.
- >-
  No pagination envelope, no total counts, no next/prev links and no Link header on any collection —
  even though Coorpacademy maintains its own @coorpacademy/baucis-links Link-header plugin on npm.
- No id-prefix scheme, so a bare identifier cannot be typed by inspection.
