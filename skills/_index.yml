summary: >-
  Five packaged Agent Skills covering the marquee integration flows across the Coorpacademy estate. Every
  operationId referenced in every skill was verified present in the harvested specifications; none is
  invented. All five carry the same cross-cutting rules, because the estate's biggest hazards are
  cross-cutting: five different auth header names, zero idempotency, zero rate-limit signal, three
  incompatible error envelopes, and an authoring model where writing to the wrong path prefix silently
  publishes nothing.
