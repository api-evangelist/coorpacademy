operations_deliberately_excluded:
- surface: 'mail (27 operations, all POST)'
  reason: >-
    Every operation sends a real email to a real learner. No idempotency key, and only 200/500 are
    declared — a 500 does not tell you whether the message was already handed to Mandrill. No skill wraps
    this service; a retry duplicates a learner-facing message.
- surface: 'platform: brandsPOST, brandsDELETE, brandsIdMigratePOST'
  reason: Tenant creation, deletion and cluster migration. Destructive at the customer level, no undo.
- surface: 'progression writes: movePOST, answersPOST, askCluePOST, viewResourcePOST, extraLifeAcceptedPOST, extraLifeRefusedPOST, currentFromDynamodbForUserPOST'
  reason: >-
    Mutate a learner's recorded performance. Return 409 on state drift, requiring a read-modify-retry loop
    with no replay-safe primitive. Belong to the player runtime, not to an integration agent.
cross_cutting_rules:
  authentication: >-
    Five different API-key header names across the estate — `authorization` (content, review),
    `Authorization` (content-scorm, mail, scorm), `token` (h5p, scim), `authentication` (platform,
    progression, progression-aggregations), `Api-Secret` (mobile). Three services declare none at all. No
    OAuth, no OIDC, no bearer tokens, no scopes. See authentication/coorpacademy-authentication.yml.
  idempotency: >-
    Does not exist. Zero matches for "idempoten" across 96 paths and 155 operations. Never blind-retry a
    POST. See conventions/coorpacademy-conventions.yml.
  rate_limits: >-
    Not published and not signalled. No 429 declared on any operation, no RateLimit-*/Retry-After header
    observed live. Self-throttle. See rate-limits/coorpacademy-rate-limits.yml.
  errors: >-
    Three incompatible envelopes, no application/problem+json, and `code` was the literal string
    "server_error" on every live body observed including a 401. Branch on HTTP status, never on `code`.
    See errors/coorpacademy-problem-types.yml.
  tenancy: >-
    Everything is brand/repository-scoped. Know which tenant you are acting for before any call.
  change_detection: >-
    No webhooks, no AsyncAPI, no xAPI/LRS. Polling is the only mechanism. See
    asyncapi/coorpacademy-event-surface.yml.
  identifiers: >-
    Content is addressed by the composite natural key (repository, ref, version) — no ids, no URNs, no
    UUIDs, no id prefixes. See data-model/coorpacademy-data-model.yml.
