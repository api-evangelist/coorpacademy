write_operations_deliberately_excluded:
  count: 88
  rationale: >-
    The estate has 88 non-GET operations and NOT ONE of them is safe for an autonomous agent as the
    contracts currently stand. There is no idempotency key anywhere (zero matches for "idempoten"
    across 155 operations), no rate-limit signal, and no dry-run mode. The specific hazards:
  hazards:
  - 'mail: 27 POST operations each send a real templated email to a real learner. A retry after a
    timeout duplicates the message. Never expose these as agent tools.'
  - 'scim: POST /{brand}/Users creates a user; PUT/PATCH mutate an identity record. A retry can
    duplicate a person.'
  - 'platform: DELETE /brands/{id} deletes a tenant; POST /brands/{id}/migrate migrates one. These are
    destructive at the tenant level.'
  - 'content: the edition/snapshot/consommation split means an upsert to the wrong surface silently
    fails to publish, or silently publishes to learners. An agent cannot tell which it did from the
    response. See data-model/coorpacademy-data-model.yml.'
  - 'progression: POST move/answers/clues/extraLife mutate a learner''s recorded performance and return
    409 on state drift, which requires a read-modify-retry loop the agent must implement itself.'
  - 'presigned-URL mints (external, scorm, content-scorm) are cheap individually and unbounded in
    aggregate, with no quota signal.'
