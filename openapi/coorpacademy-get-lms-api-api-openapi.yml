openapi: 3.2.0
info:
  description: API for Coorp Scorm player content
  version: 1.0.0
  title: scorm content Get lms API
servers:
- url: https://api.coorpacademy.com/content-scorm
  description: production
- url: https://api-staging.coorpacademy.com/content-scorm
  description: staging
- url: http://localhost:13000
  description: local
schemes:
- https
tags:
- name: Get lms api
paths:
  /lms-api:
    get:
      tags:
      - Get lms api
      summary: get lms api file from S3
      description: GET lms api file from S3
      operationId: lmsAPI
      security:
      - Authorization: []
      responses:
        '200':
          description: Get lms api
          content:
            application/json:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    InternalError:
      description: InternalError
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: number
              body:
                type: string
            example:
              statusCode: 500
              body: internal Error while resolving request
  securitySchemes:
    Authorization:
      type: apiKey
      name: Authorization
      in: header
