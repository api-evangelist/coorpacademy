openapi: 3.2.0
info:
  description: API to send emails with Mandrill
  version: 1.0.0
  title: email Content Scorm API
servers:
- url: /mail
tags:
- name: Content Scorm
paths:
  /api/v1/contentScormLink:
    post:
      tags:
      - Content Scorm
      summary: send link to download Scorm file
      description: ''
      operationId: contentScormLink
      security:
      - Authorization: []
      parameters:
      - $ref: '#/components/parameters/BrandId'
      - $ref: '#/components/parameters/RecipientAddress'
      - $ref: '#/components/parameters/DownloadLink'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    DownloadLink:
      name: data[downloadLink]
      in: formData
      description: download link scorm file
      required: true
      type: string
    RecipientAddress:
      name: recipientAddress
      in: formData
      description: an address mail
      required: true
      type: string
    BrandId:
      name: brandId
      in: formData
      description: digital, up, onboarding etc.
      type: string
      required: true
  responses:
    InternalError:
      description: InternalError
      content:
        application/json:
          schema:
            type: string
    Success:
      description: Email sent successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: object
                properties:
                  ResponseMetadata:
                    type: object
                    properties:
                      RequestId:
                        type: string
                  MD5OfMessageBody:
                    type: string
                  MessageId:
                    type: string
  securitySchemes:
    Authorization:
      type: apiKey
      name: Authorization
      in: header
