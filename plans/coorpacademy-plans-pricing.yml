summary: >-
  Coorpacademy publishes NO pricing of any kind — no plan tiers, no seat prices, no list price, no
  per-API metering, and no self-serve checkout. Every commercial path on the site is a
  contact-sales/demo-request funnel, and since the Go1 acquisition those funnels point at go1.com
  rather than at Coorpacademy. There is also no developer plan: the fourteen documented REST services
  have no signup, no key-issuance page and no published cost, so API access is negotiated inside a
  platform contract.
