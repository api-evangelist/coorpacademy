    url: errors/coorpacademy-problem-types.yml
- name: Coorpacademy Platform API
  description: >-
    Brand (tenant) management for the Coorpacademy platform — create, read, update, delete and migrate
    brands, check brand existence, list brands, and extract SSO configuration from an uploaded SAML
    `metadata.xml`. Carries the SAML/OIDC/SSO payload schemas used to configure enterprise
    single sign-on per brand. 6 paths / 9 operations. Key-gated via an `authentication` header.
  humanURL: https://api.coorpacademy.com/?urls.primaryName=api-platform
  baseURL: https://platform.coorpacademy.com/api/v1
  tags:
  - multi-tenancy
  - sso
  - saml
  - oidc
  - brand-management
  properties:
