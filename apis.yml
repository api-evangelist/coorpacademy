aid: coorpacademy
name: Coorpacademy
description: >-
  Coorpacademy is a Swiss-French corporate digital-learning platform, founded in 2013 and acquired by
  Australian edtech Go1 in April 2022, now marketed as "Coorpacademy by Go1". It sells a B2B SaaS
  learning experience platform built on inverted-pedagogy, gamified micro-learning: brand-scoped
  learning portals, a course and certification catalogue, skills taxonomies, learner progression and
  adaptive review, battles/leaderboards, and HR analytics. The platform is fronted by a public Swagger
  UI at api.coorpacademy.com that indexes fourteen internal-but-publicly-documented REST services —
  content, platform/brand management, progression, progression aggregations, SCIM 2.0 user
  provisioning, SCORM and SCORM-content players, H5P, transactional email, mobile, review mode, media,
  external upload and PDF rendering. Access to every service is key-gated; there is no self-serve
  developer signup, no published pricing, and no partner developer portal, so the specifications are
  the only machine-readable public surface.
