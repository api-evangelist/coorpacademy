- name: Coorpacademy SCIM API
  description: >-
    SCIM 2.0 user provisioning and de-provisioning for identity-manager integration, scoped per brand
    — list, create, find, PUT-update and PATCH-update users. Errors are returned in the SCIM error
    envelope (`urn:ietf:params:scim:api:messages:2.0:Error`), confirmed on a live unauthenticated
    probe. 2 paths / 5 operations. Key-gated via a `token` header.
  humanURL: https://api.coorpacademy.com/?urls.primaryName=scim
  baseURL: https://api.coorpacademy.com/scim
  tags:
  - scim
  - user-provisioning
