apis:
- name: Coorpacademy Content API
  description: >-
    Manages the Coorpacademy content repository per brand — external courses and external contents,
    skills and custom skills, certifications and certification snapshots, custom playlists, bulk
    external content ingestion, video scripts/subtitles, notifications, and consumption
    ("consommation") counters. 39 paths / 53 operations, 63 component schemas. Key-gated via an
    `authorization` header.
  humanURL: https://api.coorpacademy.com/?urls.primaryName=api-content
  baseURL: https://content.coorpacademy.com/api/v2
