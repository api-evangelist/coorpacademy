- name: Coorpacademy Email API
  description: >-
    Transactional email service backed by Mandrill, exposing one operation per templated message the
    platform sends — onboarding, welcome, signup validation and self-validation, password reset,
    first-login attempt, course finished, adaptive course finished, trending and recommended courses,
    battle invitations and waiting-opponent notices, forum reply notifications, certification done,
    coach unlocked, we-miss-you re-engagement, scoped export links, SAP notifications, assistance
    requests, Go1 subscription requests and SCORM download links. 27 paths / 27 operations. Key-gated
    via an `Authorization` header.
  humanURL: https://api.coorpacademy.com/?urls.primaryName=api-mail
  baseURL: https://api.coorpacademy.com/mail
