  - type: Overlay
    url: overlays/coorpacademy-content-scorm-overlay.yaml
- name: Coorpacademy SCORM API
  description: >-
    SCORM package storage and delivery — mint presigned S3 URLs for single and bulk SCORM uploads and
    serve root and nested files out of an unpacked SCORM resource. 4 paths / 4 operations. Key-gated
    via an `Authorization` header.
  humanURL: https://api.coorpacademy.com/?urls.primaryName=api-scorm
  baseURL: https://api.coorpacademy.com/scorm
  tags:
