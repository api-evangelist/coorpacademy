    url: openapi/coorpacademy-platform-openapi.json
  - type: APIReference
    url: https://api.coorpacademy.com/?urls.primaryName=api-platform
  - type: Authentication
    url: authentication/coorpacademy-authentication.yml
- name: Coorpacademy Progression API
  description: >-
    The learner progression engine — create and read progressions, record moves, answers, clue
    requests, resource views and extra-life accept/refuse decisions, plus a v2 analytics surface for
    completion, slide counts, per-slide analytics, review stars by skill and hero recommendations,
    both for the calling learner and (admin-scoped) for a named userId. 21 paths / 26 operations.
    Key-gated via an `authentication` header.
  humanURL: https://api.coorpacademy.com/?urls.primaryName=api-progression
  baseURL: https://progression.coorpacademy.com/api
  tags:
  - learning-analytics
  - progression
  - adaptive-learning
  - gamification
