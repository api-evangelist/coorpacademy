  - type: Overlay
    url: overlays/coorpacademy-scim-overlay.yaml
  - type: Conformance
    url: conformance/coorpacademy-conformance.yml
- name: Coorpacademy SCORM Content API
  description: >-
    Backing API for the Coorpacademy SCORM player — fetch slides, chapters, levels, exit nodes and
    clue payloads, post answers and moves, mark resources as viewed, accept/refuse extra lives,
    initialise player data, retrieve the LMS API file, resolve a SCORM launch URL, map a Go1
    enrolment_id to a Coorpacademy progression, and mint a presigned S3 upload URL for bulk SCORM
    packages. 16 paths / 16 operations. Key-gated via an `Authorization` header.
  humanURL: https://api.coorpacademy.com/?urls.primaryName=api-content-scorm
  baseURL: https://api.coorpacademy.com/content-scorm
  tags:
