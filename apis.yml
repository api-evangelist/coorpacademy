  - type: Overlay
    url: overlays/coorpacademy-progression-overlay.yaml
  - type: ErrorCatalog
    url: errors/coorpacademy-problem-types.yml
- name: Coorpacademy Progression Aggregations API
  description: >-
    A separate aggregation service over the same progression data store, exposing DynamoDB-backed
    per-slide analytics and per-user completion and slide-count reads/writes under a /v1 prefix.
    3 paths / 5 operations. Key-gated via an `authentication` header.
  humanURL: https://api.coorpacademy.com/?urls.primaryName=api-progression-aggregations
  baseURL: https://aggregation-progression.coorpacademy.com/api
