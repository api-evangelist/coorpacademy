    remaining eleven are pinned at 1.0.0 (mobile at 2.0.0) and carry no signal.
  baseline_captured: '2026-08-17'
  how_to_use: >-
    Re-fetch the specs listed in openapi/ and diff info.version plus the operation set. A rising patch
    number with an unchanged operation set is internal churn; a changed operation set is an API change
    that was shipped without any announcement.
- kind: status-page-incident-feed
  detail: >-
    https://coorpacademy.status.io/pages/59c0fe78af68b1046e096a85/rss carries ten dated incident
    entries spanning 2019-09-06 to 2023-03-16. These are outage notices, NOT API changes, and are
    recorded in lifecycle/coorpacademy-lifecycle.yml rather than treated as changelog entries.
- kind: npm-release-history
  detail: >-
    The 73 first-party npm packages under the @coorpacademy scope have real, dated releases (most
    recent observed 2026-06-05 for @coorpacademy/components 11.40.23, player-web 4.29.24 and
    app-review 0.46.23). This is the only continuously-dated public release trail the company
    maintains, and it covers the front-end component estate rather than the APIs. See
    packages/coorpacademy-packages.yml.
