inferred_enforcement:
  note: >-
    api.coorpacademy.com sits behind AWS API Gateway, then CloudFront (two hops), then Cloudflare. All
    three of those layers CAN throttle, and AWS API Gateway applies account-level defaults whether or
    not a provider configures them. So throttling almost certainly exists in production — it is simply
    undisclosed and unsignalled. The three Express hosts (content, progression, platform) show no
    gateway in front of them at all.
  consequence: >-
    A client cannot distinguish a throttle from an outage, cannot know when to retry, and has no quota
    visibility. The only safe integration strategy is conservative self-throttling with exponential
    backoff on any 5xx, and extra care on the mail service, where a retry can duplicate a
    learner-facing email (no idempotency key exists — see conventions/).
